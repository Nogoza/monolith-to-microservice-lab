<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Storefront{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="{% url 'catalog:home' %}">Storefront</a>
        <nav>
            <a href="{% url 'catalog:product_list' %}">Shop</a>
            <a href="{% url 'cart:view_cart' %}">Cart</a>
            {% if user.is_authenticated %}
                <a href="{% url 'orders:history' %}">Orders</a>
                <a href="{% url 'reports:sales' %}">Sales report</a>
                <a href="{% url 'accounts:profile' %}">{{ user.username }}</a>
                <form action="{% url 'accounts:logout' %}" method="post" class="inline-form">
                    {% csrf_token %}
                    <button type="submit">Log out</button>
                </form>
            {% else %}
                <a href="{% url 'accounts:login' %}">Log in</a>
                <a href="{% url 'accounts:register' %}">Register</a>
            {% endif %}
        </nav>
    </header>

    <main class="container">
        {% if messages %}
            <ul class="messages">
                {% for message in messages %}
                    <li class="{{ message.tags }}">{{ message }}</li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; Storefront</p>
    </footer>
</body>
</html>
