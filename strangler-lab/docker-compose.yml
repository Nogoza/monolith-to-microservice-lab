services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: storefront
      POSTGRES_USER: storefront
      POSTGRES_PASSWORD: storefront_pw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storefront"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    build: .
    restart: always
    environment:
      - SECRET_KEY=django-insecure-8f2k4jz9q!x3m0t7v-storefront-prod-key-do-not-share
      - DEBUG=True
      - DB_NAME=storefront
      - DB_USER=storefront
      - DB_PASSWORD=storefront_pw
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
      - logfiles:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web-reports:
    build: .
    restart: always
    environment:
      - SECRET_KEY=django-insecure-8f2k4jz9q!x3m0t7v-storefront-prod-key-do-not-share
      - DEBUG=True
      - DB_NAME=storefront
      - DB_USER=storefront
      - DB_PASSWORD=storefront_pw
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/1
    volumes:
      - staticfiles:/app/staticfiles
      - mediafiles:/app/media
      - logfiles:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    build: ./nginx
    volumes:
      - staticfiles:/app/staticfiles:ro
      - mediafiles:/app/media:ro
    ports:
      - "8000:80"
    depends_on:
      web:
        condition: service_healthy
      web-reports:
        condition: service_healthy

volumes:
  pgdata:
  staticfiles:
  mediafiles:
  logfiles:
