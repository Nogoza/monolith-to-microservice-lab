events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    resolver 127.0.0.11 valid=10s;

    # Raporlar için 5 dakikalık hızlı önbellek
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=reports_cache:10m inactive=5m max_size=100m;

    server {
        listen 80;

        location /static/ {
            alias /app/staticfiles/;
        }

        location /media/ {
            alias /app/media/;
        }

        # 1. Ağır rapor istekleri izole web-reports servisine gider
        location /reports/ {
            proxy_cache reports_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_key "$scheme$request_method$host$request_uri";
            
            # Django'nun "Bunu saklama" dediği başlıkları ez geç ve önbelleğe al
            proxy_ignore_headers Cache-Control Set-Cookie;
            proxy_hide_header Set-Cookie;
            
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;

            set $upstream_reports http://web-reports:8000;
            proxy_pass $upstream_reports;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # 2. Müşteri trafiği (sepet, sipariş, vitrin) ana web servislerine gider
        location / {
            set $upstream http://web:8000;
            proxy_pass $upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}